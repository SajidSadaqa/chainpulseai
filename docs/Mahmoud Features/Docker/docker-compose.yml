
services:

  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: chainpulse-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ChainPulseAI_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ChainPulseAI_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ASP.NET Core API
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile

    container_name: chainpulse-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ConnectionDb: "Host=db;Port=5432;Database=ChainPulseAI_db;Username=postgres;Password=${POSTGRES_PASSWORD}"

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
